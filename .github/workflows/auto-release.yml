name: Auto Release

on:
  push:
    branches: [main]
    paths-ignore:
      - "README.md"
      - "task.md"
      - ".github/**"
      - "update-manifest.json"

permissions:
  contents: write

jobs:
  auto-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compute next version
        id: version
        run: |
          # Base on the latest existing git tag (not style.css, which was
          # never committed back to main by the old release-triggered
          # workflow) so repeated pushes never collide on the same tag.
          latest_tag=$(git tag --list 'v[0-9]*.[0-9]*.[0-9]*' | sed 's/^v//' | sort -t. -k1,1n -k2,2n -k3,3n | tail -1)
          if [ -z "$latest_tag" ]; then
            latest_tag="1.0.0"
          fi
          echo "Latest tag: v$latest_tag"
          IFS='.' read -r major minor patch <<< "$latest_tag"
          patch=$((patch + 1))
          next="$major.$minor.$patch"
          echo "Next version: $next"
          echo "version=$next" >> "$GITHUB_OUTPUT"
          echo "tag=v$next" >> "$GITHUB_OUTPUT"

      - name: Update style.css version
        run: |
          awk -v v="${{ steps.version.outputs.version }}" '
          BEGIN{found=0}
          /^Version:/ {$0="Version: " v; found=1}
          {print}
          END{if(!found) print "Version: " v}
          ' style.css > tmp
          mv tmp style.css

      - name: Create theme folder
        run: |
          # Folder name must not contain a dot: WordPress core strips
          # non [A-Za-z0-9_-] characters when sanitizing theme slugs in its
          # own update/AJAX handlers, which silently breaks manual and
          # automatic updates for a dotted folder name like "a-salah.dev".
          mkdir a-salah-theme
          rsync -av ./ a-salah-theme/ \
          --exclude=".git" \
          --exclude=".github" \
          --exclude="node_modules" \
          --exclude=".idea" \
          --exclude="README.md" \
          --exclude="task.md" \
          --exclude="*.patch" \
          --exclude="a-salah-theme"

      - name: Create zip package
        run: zip -r a-salah-theme.zip a-salah-theme

      - name: Create release with zip attached
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ steps.version.outputs.tag }}" \
            a-salah-theme.zip \
            --title "Version ${{ steps.version.outputs.version }}" \
            --generate-notes \
            --target "${{ github.sha }}"

      - name: Publish update-manifest.json (bypasses api.github.com rate limits)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          repo="${{ github.repository }}"
          tag="${{ steps.version.outputs.tag }}"
          html_url="https://github.com/$repo/releases/tag/$tag"
          download_url="https://github.com/$repo/releases/download/$tag/a-salah-theme.zip"
          notes=$(gh release view "$tag" --json body -q .body)

          python3 - "$tag" "$html_url" "$download_url" "$notes" <<'PY'
          import json, sys
          tag, html_url, download_url, notes = sys.argv[1:5]
          manifest = {
              "tag_name": tag,
              "html_url": html_url,
              "body": notes,
              "assets": [
                  {
                      "name": "a-salah-theme.zip",
                      "browser_download_url": download_url,
                  }
              ],
          }
          with open("update-manifest.json", "w") as f:
              json.dump(manifest, f, indent=2)
          PY

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add update-manifest.json
          git commit -m "chore: update manifest for ${{ steps.version.outputs.tag }}"
          git push origin main
